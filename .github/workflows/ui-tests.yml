name: UI tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite file to run
        type: string
        default: src/test/resources/suites/demotests.xml
        required: true
      reportType:
        description: Report backend
        type: choice
        options:
          - allure
          - extent
        default: allure
      platform:
        description: Browser
        type: choice
        options:
          - chrome
          - firefox
          - edge
        default: chrome
      timeout:
        description: Wait timeout in milliseconds (empty = use the config file's value)
        type: number
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual runs use the form inputs; pull_request runs have none, so fall back to the defaults.
    env:
      SUITE: ${{ inputs.suite || 'src/test/resources/suites/demotests.xml' }}
      REPORT_TYPE: ${{ inputs.reportType || 'allure' }}
      PLATFORM: ${{ inputs.platform || 'chrome' }}
      TIMEOUT_MS: ${{ inputs.timeout }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships Chrome, Firefox and Edge; Selenium Manager downloads the matching driver.
      - name: Run tests
        run: |
          args=(-B test "-DsuiteXmlFile=$SUITE" "-DreportType=$REPORT_TYPE" "-Dplatform=$PLATFORM"
                -Dheadless=true -Dmaven.test.failure.ignore=false)
          if [ -n "$TIMEOUT_MS" ]; then
            if ! [[ "$TIMEOUT_MS" =~ ^[0-9]+$ ]]; then
              echo "::error::timeout must be a whole number of milliseconds, got '$TIMEOUT_MS'"
              exit 1
            fi
            args+=("-Dtimeout=$TIMEOUT_MS")
          fi
          mvn "${args[@]}"

      - name: Summarize results
        if: always()
        run: |
          results=target/surefire-reports/testng-results.xml
          if [ -f "$results" ]; then
            {
              echo "### Test results"
              grep -o '<testng-results[^>]*>' "$results" \
                | grep -oE '(total|passed|failed|skipped)="[0-9]+"' \
                | sed -E 's/"//g; s/=/: /; s/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TestNG results found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.PLATFORM }}-${{ env.REPORT_TYPE }}-run${{ github.run_number }}
          path: |
            target/reports/
            target/surefire-reports/
          if-no-files-found: warn
